<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Create Product</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row">
        <div class="col-md-6">
            <h2>Create Product</h2>
            <form th:action="@{/products/create}" th:object="${product}" method="post" enctype="multipart/form-data">
                <div class="form-group mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="product Name"
                           th:classappend="${#fields.hasErrors('name') ? 'is-invalid' : ''}">
                    <div class="alert alert-warning" th:if="${#fields.hasErrors('name')}">
                        <span th:errors="*{name}"></span>
                    </div>
                </div>

                <div class="form-group mb-3">
                    <label for="price" class="form-label">Price:</label>
                    <input type="number" class="form-control" id="price" th:field="*{price}" placeholder="price"
                           th:classappend="${#fields.hasErrors('price') ? 'is-invalid' : ''}">
                    <div class="alert alert-warning" th:if="${#fields.hasErrors('price')}">
                        <span th:errors="*{price}"></span>
                    </div>
                </div>

                <div class="form-group mb-3">
                    <label for="image" class="form-label">Image:</label>
                    <div>
                        <label>Chọn tệp</label>
                        <span th:if="${#fields.hasErrors('image')}" class="text-danger">Không có tệp nào được chọn</span>
                    </div>
                    <input type="file" class="form-control" id="image" name="imageProduct" accept="image/png,image/jpeg">
                </div>

                <div class="form-group mb-3">
                    <label for="category" class="form-label">Category:</label>
                    <select class="form-control" id="category" name="categoryId">
                        <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                    </select>
                    <div class="alert alert-warning" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                </div>

                <div class="form-group mb-3">
                    <input type="submit" class="btn btn-success" value="Add Product">
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
