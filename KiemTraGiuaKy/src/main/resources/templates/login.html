<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="screen-auth">
<div class="auth-shell">
    <div class="auth-card">
        <p class="eyebrow">Bảo mật hệ thống</p>
        <h1>Đăng nhập</h1>

        <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert error" th:if="${param.error}">
            Sai tên đăng nhập hoặc mật khẩu.
        </div>
        <div class="alert success" th:if="${param.logout}">
            Bạn đã đăng xuất thành công.
        </div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <label for="username">Tên đăng nhập</label>
            <input id="username" name="username" type="text" placeholder="Nhập tên đăng nhập" required>

            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" required>

            <button type="submit" class="button">Đăng nhập</button>
        </form>

        <a th:href="@{/register}" class="text-link">Chưa có tài khoản? Đăng ký</a>
    </div>
</div>
</body>
</html>
