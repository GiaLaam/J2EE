<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản sinh viên</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="screen-auth">
<div class="auth-shell">
    <div class="auth-card">
        <p class="eyebrow">Đăng ký sinh viên</p>
        <h1>Đăng ký tài khoản</h1>

        <div class="alert error" th:if="${registerError}" th:text="${registerError}"></div>

        <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="auth-form">
            <label for="username">Tên đăng nhập</label>
            <input id="username" type="text" th:field="*{username}" placeholder="Nhập tên đăng nhập">
            <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

            <label for="password">Mật khẩu</label>
            <input id="password" type="password" th:field="*{password}" placeholder="Nhập mật khẩu">
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" placeholder="Nhập email">
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

            <button type="submit" class="button">Đăng ký</button>
        </form>

        <a th:href="@{/login}" class="text-link">Đã có tài khoản? Đăng nhập</a>
    </div>
</div>
</body>
</html>
