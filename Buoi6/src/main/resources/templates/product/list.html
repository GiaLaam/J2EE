<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Book Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
        }
        .header {
            background: #000000;
            color: white;
            padding: 20px 30px;
            border-bottom: 2px solid #000000;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header-top h1 {
            font-size: 24px;
            font-weight: 600;
        }
        .btn-logout {
            background: #ffffff;
            color: #000000;
            border: 1px solid #000000;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .btn-logout:hover {
            background: #f0f0f0;
        }
        .tab-navigation {
            display: flex;
            gap: 0;
            border-bottom: 2px solid #ffffff;
        }
        .tab-item {
            padding: 12px 30px;
            text-decoration: none;
            color: #cccccc;
            background: #000000;
            font-weight: 500;
            font-size: 16px;
            border-right: 1px solid #333333;
        }
        .tab-item:hover {
            background: #222222;
            color: #ffffff;
        }
        .tab-item.active {
            background: #ffffff;
            color: #000000;
            font-weight: 600;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 20px 0;
            border-bottom: 2px solid #000000;
        }
        .content-header h2 {
            color: #000000;
            font-size: 24px;
            font-weight: 600;
        }
        .btn {
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            border: 2px solid #000000;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            background: #000000;
            color: #ffffff;
        }
        .btn:hover {
            background: #333333;
        }
        .btn-secondary {
            background: #ffffff;
            color: #000000;
        }
        .btn-secondary:hover {
            background: #f0f0f0;
        }
        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border: 2px solid #000000;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border: 1px solid #000000;
        }
        th {
            background: #000000;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
        }
        tbody tr:hover {
            background: #f5f5f5;
        }
        .action-links {
            display: flex;
            gap: 8px;
        }
        .action-links .btn {
            padding: 6px 14px;
            font-size: 13px;
        }
        .product-image {
            width: 80px;
            height: 100px;
            object-fit: cover;
            border: 1px solid #000000;
        }
        .no-image {
            width: 80px;
            height: 100px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #000000;
            color: #666;
            font-size: 11px;
            font-weight: 600;
        }
        .category-badge {
            background: #000000;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <h1>Book Management System</h1>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
        <div class="tab-navigation">
            <a th:href="@{/products}" class="tab-item active">Products</a>
            <a th:href="@{/categories}" class="tab-item">Categories</a>
        </div>
    </div>
    
    <div class="container">
        <div class="content-header">
            <h2>Products Management</h2>
            <a sec:authorize="hasAuthority('ROLE_ADMIN')" th:href="@{/products/add}" class="btn">
                Add New Product
            </a>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Image</th>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Author</th>
                    <th>Price</th>
                    <th>Category</th>
                    <th>Quantity</th>
                    <th sec:authorize="hasAuthority('ROLE_ADMIN')">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <td>
                        <img th:if="${product.image != null}" 
                             th:src="@{'/uploads/images/' + ${product.image}}" 
                             alt="Product image" 
                             class="product-image">
                        <div th:if="${product.image == null}" class="no-image">
                            No Image
                        </div>
                    </td>
                    <td th:text="${product.id}"></td>
                    <td><strong th:text="${product.name}"></strong></td>
                    <td th:text="${product.author}"></td>
                    <td><strong th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></strong></td>
                    <td>
                        <span class="category-badge" th:text="${product.category.name}"></span>
                    </td>
                    <td th:text="${product.quantity}"></td>
                    <td sec:authorize="hasAuthority('ROLE_ADMIN')">
                        <div class="action-links">
                            <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn">Edit</a>
                            <a th:href="@{/products/delete/{id}(id=${product.id})}" 
                               class="btn btn-secondary"
                               onclick="return confirm('Are you sure you want to delete this product?')">Delete</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
