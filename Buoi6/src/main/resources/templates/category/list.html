<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Book Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
        }
        .header {
            background: #000000;
            color: white;
            padding: 20px 30px;
            border-bottom: 2px solid #000000;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header-top h1 {
            font-size: 24px;
            font-weight: 600;
        }
        .btn-logout {
            background: #ffffff;
            color: #000000;
            border: 1px solid #000000;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .btn-logout:hover {
            background: #f0f0f0;
        }
        .tab-navigation {
            display: flex;
            gap: 0;
            border-bottom: 2px solid #ffffff;
        }
        .tab-item {
            padding: 12px 30px;
            text-decoration: none;
            color: #cccccc;
            background: #000000;
            font-weight: 500;
            font-size: 16px;
            border-right: 1px solid #333333;
        }
        .tab-item:hover {
            background: #222222;
            color: #ffffff;
        }
        .tab-item.active {
            background: #ffffff;
            color: #000000;
            font-weight: 600;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 20px 0;
            border-bottom: 2px solid #000000;
        }
        .content-header h2 {
            color: #000000;
            font-size: 24px;
            font-weight: 600;
        }
        .btn {
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            border: 2px solid #000000;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            background: #000000;
            color: #ffffff;
        }
        .btn:hover {
            background: #333333;
        }
        .btn-secondary {
            background: #ffffff;
            color: #000000;
        }
        .btn-secondary:hover {
            background: #f0f0f0;
        }
        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border: 2px solid #000000;
        }
        th, td {
            padding: 18px 15px;
            text-align: left;
            border: 1px solid #000000;
        }
        th {
            background: #000000;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
        }
        tbody tr:hover {
            background: #f5f5f5;
        }
        .action-links {
            display: flex;
            gap: 8px;
        }
        .action-links .btn {
            padding: 6px 14px;
            font-size: 13px;
        }
        .category-name {
            font-size: 16px;
            font-weight: 600;
            color: #000000;
        }
        .category-desc {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <h1>Book Management System</h1>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
        <div class="tab-navigation">
            <a th:href="@{/products}" class="tab-item">Products</a>
            <a th:href="@{/categories}" class="tab-item active">Categories</a>
        </div>
    </div>
    
    <div class="container">
        <div class="content-header">
            <h2>Categories Management</h2>
            <a sec:authorize="hasAuthority('ROLE_ADMIN')" th:href="@{/categories/add}" class="btn">
                Add New Category
            </a>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th sec:authorize="hasAuthority('ROLE_ADMIN')">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="category : ${categories}">
                    <td th:text="${category.id}"></td>
                    <td>
                        <div class="category-name" th:text="${category.name}"></div>
                    </td>
                    <td>
                        <div class="category-desc" th:text="${category.description}"></div>
                    </td>
                    <td sec:authorize="hasAuthority('ROLE_ADMIN')">
                        <div class="action-links">
                            <a th:href="@{/categories/edit/{id}(id=${category.id})}" class="btn">Edit</a>
                            <a th:href="@{/categories/delete/{id}(id=${category.id})}" 
                               class="btn btn-secondary"
                               onclick="return confirm('Are you sure you want to delete this category?')">Delete</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
